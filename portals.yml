    query: 'site:linkedin.com/jobs "Senior Software Engineer" "Full Stack" OR "Frontend" India "React" OR "Angular" "product" -"service" after:2026-03-28'
    enabled: true

  - name: LinkedIn — AI Engineer India 35LPA+
    query: 'site:linkedin.com/jobs "Senior AI Engineer" OR "AI Engineer" OR "LLM Engineer" "Full Stack" OR "Frontend" India Bengaluru OR Bangalore after:2026-03-28'
    enabled: true

  # -- Greenhouse India companies --
