    enabled: true

  - name: Naukri — SDUI Full-Stack Product Company
    query: 'site:naukri.com "Full Stack" "React" OR "Angular" Senior "product company" OR "product based" Bengaluru'
    enabled: true

  # -- LinkedIn India (broad discovery) --
