# Portal Scanner Configuration
# Used by /career-ops scan to discover new offers automatically.
#
# Strategy (3 levels):
#   1. Playwright → careers_url of each company (real-time, reliable)
#   2. Greenhouse API → structured JSON (fast, Greenhouse-only)
#   3. WebSearch with site: filters (broad discovery, may be stale)
#
# IMPORTANT: Each company in tracked_companies MUST have careers_url.
#   Prefer the BRANDED company careers URL whenever available; use ATS-hosted URL only as fallback.
#   ✅ https://careers.mastercard.com   ⚠️ https://mastercard.wd1.myworkdayjobs.com (fallback only)
#   ✅ https://openai.com/careers       ⚠️ https://job-boards.greenhouse.io/openai (fallback only)
#   Exception: ATS-hosted careers_url is acceptable when no branded careers page exists.
#   Using raw ATS URLs when a branded page exists can cause false 410 errors (job ID mismatch).
#
# HOW TO CUSTOMIZE:
#   1. Copy this file to portals.yml in the project root
#   2. Edit title_filter.positive with YOUR target role keywords
#   3. Add/remove companies in tracked_companies
#   4. Adjust search_queries for your preferred job boards
#   5. Set enabled: false on companies you don't care about

# -- Title filter --
# Tailored for Stevens Philip — Senior Full-Stack & AI Engineer, Bengaluru

title_filter:
  positive:
    # -- Full-Stack / General Senior IC --
    - "Full Stack"
    - "Full-Stack"
    - "Software Engineer"
    - "Software Developer"
    - "Software Development Engineer"
    - "SDE"
    - "SDE3"
    - "SDE-3"
    - "Software Developer 3"
    - "Software Development Engineer 3"
    - "Software Engineer III"
    - "Software Engineer 3"
    - "Engineer III"
    - "Engineer 3"
    - "Product Engineer"
    - "Member of Technical Staff"
    - "MTS"
    # -- Frontend --
    - "Frontend"
    - "Frontend Developer"
    - "React"
    - "Angular"
    - "UI Developer"
    - "UI Engineer"
    # -- Lead / Tech Lead --
    - "Tech Lead"
    - "Technical Lead"
    - "Lead Software"
    - "Lead Engineer"
    # -- AI/ML roles --
    - "AI"
    - "ML"
    - "LLM"
    - "Agent"
    - "Agentic"
    - "GenAI"
    - "Generative AI"
    - "NLP"
    - "LLMOps"
    - "MLOps"
    # -- Architecture / Platform --
    - "Platform Engineer"
    - "Solutions Engineer"
  negative:
    - "Junior"
    - "Intern"
    - "Trainee"
    - "Fresher"
    - "iOS"
    - "Android"
    - "PHP"
    - "Ruby"
    - "Data Scientist"
    - "Research Scientist"
    - "Embedded"
    - "Firmware"
    - "FPGA"
    - "ASIC"
    - "Blockchain"
    - "Web3"
    - "Crypto"
    - "SAP "
    - "Mainframe"
    - "COBOL"
    - "Solutions Architect"
    - "Account Executive"
    - "Account Manager"
    - "Forward Deployed"
    - "Video Editor"
    - "Product Designer"
    - "UX Writer"
    - "Campaign Strategist"
    - "Financial Analyst"
    - "Regulatory Counsel"
    - "Outcomes Manager"
  seniority_boost:
    - "Senior"
    - "Staff"
    - "Principal"
    - "Lead"
    - "Head"
    - "Director"

# -- Search queries --
# Target: India product companies, 35+ LPA, Bengaluru/remote
# Stevens Philip — Full-Stack SDE2 + AI background

search_queries:

  # -- Cutshort (curated India tech hiring) --
  - name: Cutshort — Senior Full-Stack India
    query: 'site:cutshort.io "Senior Software Engineer" OR "Senior SDE" OR "Full Stack" Bengaluru OR Bangalore OR India React OR Angular'
    enabled: true

  - name: Cutshort — AI Engineer India
    query: 'site:cutshort.io "AI Engineer" OR "LLM Engineer" OR "ML Engineer" OR "GenAI" Senior Bengaluru OR India'
    enabled: true

  - name: Cutshort — SDE2 SDE3 India
    query: 'site:cutshort.io "SDE2" OR "SDE3" OR "SDE-2" OR "SDE-3" India React OR Angular OR AI'
    enabled: true

  # -- Wellfound / AngelList (startup jobs India) --
  - name: Wellfound — Senior SDE India
    query: 'site:wellfound.com "Senior Software Engineer" OR "Full Stack" India Bengaluru OR Bangalore React OR Angular'
    enabled: true

  - name: Wellfound — AI Engineer India
    query: 'site:wellfound.com "AI Engineer" OR "LLM" OR "GenAI" Senior India Bengaluru'
    enabled: true

  - name: Wellfound — AI Startup India
    query: 'site:wellfound.com AI startup India "Senior" engineer "35" OR "40" OR "45" lpa'
    enabled: false  # salary terms rarely appear in indexed content

  # -- iimjobs (senior India roles) — disabled: skewed toward MBA/management, low quality SWE --
  - name: iimjobs — Senior Full-Stack Bengaluru
    query: 'site:iimjobs.com "Senior Software Engineer" OR "Full Stack" Bengaluru OR Bangalore React OR Angular'
    enabled: false

  - name: iimjobs — AI ML Engineer India
    query: 'site:iimjobs.com "AI Engineer" OR "ML Engineer" OR "Generative AI" Senior India'
    enabled: false

  # -- Naukri (India's largest job board) --
