    query: 'site:job-boards.greenhouse.io "Software Engineer" OR "Full Stack" OR "AI Engineer" India OR Bengaluru OR Bangalore Senior'
    enabled: true

  - name: Greenhouse — India Fintech AI Senior
    query: 'site:job-boards.greenhouse.io "Software Engineer" India fintech OR insurtech OR payments Senior React OR Angular'
